name: Deploy the email engine (Apps Script)
# Every change to source/apps-script/Code.gs goes live on its own: pushed to the
# "Ranch Leads" script and published as a new version of the existing web app
# deployment, so the engine's address never changes.
# One-time setup by Chris (see source/apps-script/DEPLOY.md):
#   secret CLASPRC_JSON  = the contents of ~/.clasprc.json after "clasp login"
#   variable SCRIPT_ID   = the script's ID (Project Settings > IDs; not a secret)
on:
  push:
    branches: [main]
    paths: ['source/apps-script/Code.gs']
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: engine-deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOYMENT_ID: AKfycbz0ALnuwyuwKaRkr2sGS7N_TPJ3DIXYYRiLP7RiNlBvv5HfQMxfy82jS88ihRab7Duu
      SCRIPT_ID: ${{ vars.SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Check setup
        id: setup
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::warning::Engine not deployed: add the CLASPRC_JSON secret and SCRIPT_ID variable (source/apps-script/DEPLOY.md)."
            echo "ready=no" >> $GITHUB_OUTPUT
          else echo "ready=yes" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.ready == 'yes'
        with: { node-version: '20' }
      - name: Code.gs must be plain ASCII and valid JavaScript
        if: steps.setup.outputs.ready == 'yes'
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' source/apps-script/Code.gs; then echo "::error::Non-ASCII characters in Code.gs"; exit 1; fi
          node -e "new Function(require('fs').readFileSync('source/apps-script/Code.gs','utf8'))"
      - name: Push and publish a new version
        if: steps.setup.outputs.ready == 'yes'
        run: |
          # keep only the JSON (Terminal copies can pick up a prompt or a trailing % before/after it)
          printf '%s' "$CLASPRC_JSON" | node -e "let t=require('fs').readFileSync(0,'utf8');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a>=0&&b>a)t=t.slice(a,b+1);const fix=[x=>x,x=>x.replace(/[\\r\\n]+/g,''),x=>x.replace(/[\\u201c\\u201d]/g,'\\x22').replace(/[\\u2018\\u2019]/g,'\\x27').replace(/[\\r\\n]+/g,'')];let out=t,why='';for(const f of fix){try{JSON.parse(f(t));out=f(t);why='';break}catch(e){why=e.message.replace(/[A-Za-z0-9_\\-\\/+=.]{12,}/g,'...')}}if(why)console.error('Sign-in text does not parse: '+why);process.stdout.write(out)" > ~/.clasprc.json
          # which clasp wrote the sign-in? (prints only the top-level key names, never values)
          FMT=$(node -e "try{const j=JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'));console.log(j.tokens?'v3':j.token?'v2':'unknown:'+Object.keys(j).join(','))}catch(e){const t=require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8');console.log('not-json (length '+t.length+', starts with a brace: '+(t.trim()[0]==='{')+', ends with a brace: '+(t.trim().slice(-1)==='}')+')')}")
          echo "Sign-in format: $FMT"
          case "$FMT" in v3) V=3;; v2) V=2;; *) echo "::error::CLASPRC_JSON isn't a clasp sign-in ($FMT). Copy everything printed by: cat ~/.clasprc.json"; exit 1;; esac
          npm install -g @google/clasp@$V >/dev/null 2>&1
          mkdir -p /tmp/engine && cd /tmp/engine
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull                       # brings the project's manifest (appsscript.json) and file list
          ls
          cp "$GITHUB_WORKSPACE/source/apps-script/Code.gs" Code.js
          clasp push --force
          if [ "$V" = 3 ]; then clasp update-deployment "$DEPLOYMENT_ID" --description "From GitHub ${GITHUB_SHA::7}"
          else clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "From GitHub ${GITHUB_SHA::7}"; fi
          rm -f ~/.clasprc.json
