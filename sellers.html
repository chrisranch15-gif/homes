<style>
:root{--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--ink:#1E2327;--ground:#F7F5F1;--accent:#8C6A43;--night:#16191B;--muted:#5E584E;--line:#D9D2C6;--card:#fff;--soft:#EFEBE4;--ok:#3F6B45}
*{box-sizing:border-box}html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15}
a{color:inherit}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.wrap{max-width:880px;margin:0 auto;padding:0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);font:inherit;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{background:transparent;color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:var(--ground)}
.btn.light{background:var(--ground);color:var(--ink);border-color:var(--ground)}
.btn[disabled]{opacity:.6;cursor:default}
input,textarea{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:0;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.top{background:var(--night);color:var(--ground)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:62px;gap:12px}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.02em}
.brand small{display:block;font:11px var(--sans);letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.top button{background:none;border:0;color:var(--ground);opacity:.7;font:13px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.hero{position:relative;background:var(--night) center/cover no-repeat;color:#fff;min-height:430px;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,25,27,.1) 20%,rgba(22,25,27,.82))}
.hero .wrap{position:relative;z-index:1;padding-bottom:40px;width:100%}
.hero h1{font-size:clamp(34px,6vw,54px);margin:10px 0 8px}
.hero .eyebrow{color:#E8D9C3}
.hero p{margin:0;opacity:.9}
section{padding:46px 0;border-bottom:1px solid var(--line)}
section h2{font-size:30px;margin:8px 0 18px}
.journey{display:flex;gap:0;margin:0;padding:0;list-style:none;overflow-x:auto}
.journey li{flex:1 0 110px;padding:14px 10px 0 0;border-top:2px solid var(--line);font-size:13px;color:var(--muted);position:relative}
.journey li:before{content:"";position:absolute;top:-6px;left:0;width:10px;height:10px;border-radius:50%;background:var(--line)}
.journey li.done{border-color:var(--ink);color:var(--ink)}.journey li.done:before{background:var(--ink)}
.journey li.now{border-color:var(--accent);color:var(--ink);font-weight:500}.journey li.now:before{background:var(--accent);box-shadow:0 0 0 4px rgba(140,106,67,.2)}
.journey b{display:block;font-weight:500;color:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--card);padding:20px 18px}
.stat .n{font-family:var(--serif);font-size:40px;line-height:1}
.stat .l{font-size:13px;color:var(--muted);margin-top:8px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.letter{background:var(--card);border:1px solid var(--line);padding:28px}
.letter h3{font-size:24px;margin:6px 0 12px}
.letter p{margin:0 0 12px;white-space:pre-line}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .when{font-size:13px;color:var(--muted)}
.timeline .what{font-weight:500}
.timeline .reach{display:inline-block;font-size:12px;letter-spacing:.06em;background:var(--soft);padding:2px 8px;margin-left:6px;vertical-align:2px}
.share{background:var(--night);color:var(--ground);padding:30px}
.share .link{display:flex;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.share .link input{flex:1 1 260px;background:rgba(255,255,255,.06);border-color:rgba(247,245,241,.25);color:var(--ground)}
.share .cap{font-size:14px;opacity:.85;border-left:2px solid var(--accent);padding-left:14px;margin-top:14px}
.shows{display:grid;gap:0;border-top:1px solid var(--line)}
.sh{display:flex;align-items:baseline;gap:16px;padding:14px 2px;border-bottom:1px solid var(--line)}
.sh .d{min-width:150px;font-size:15px}.sh .t{flex:1;color:var(--muted);font-size:14px}
.sh .st{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.sh.off .d,.sh.off .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.shsum{display:flex;gap:28px;flex-wrap:wrap;margin:6px 0 18px}.shsum div{font-family:var(--serif,Georgia),serif;font-size:34px;line-height:1}.shsum span{display:block;font-family:inherit;font-size:13px;color:var(--muted);margin-top:6px}
.dayc{background:var(--card);border:1px solid var(--line);padding:24px 26px;margin:14px 0 6px}.dayc .dn{font-family:var(--serif,Georgia,serif);font-size:30px;line-height:1.1}.dayc .dn b{font-size:52px;color:var(--accent);font-weight:500}.dayc .dl{color:var(--muted);margin:6px 0 18px}.dayc .dl b{color:var(--ink,#1d1d1b);font-weight:600}.trk{position:relative;height:8px;background:var(--line);border-radius:4px;margin:0 6px}.trk>span{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:4px}.trk .tk{position:absolute;top:-3px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--paper,#fff);border:2px solid var(--line)}.trk .tk.on{border-color:var(--accent);background:var(--accent)}.trk .you{position:absolute;top:-8px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:var(--paper,#fff);border:3px solid var(--accent);box-shadow:0 0 0 5px rgba(140,106,67,.18)}.tke{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:14px}
.bts{margin-top:26px;padding:20px 24px;border-left:3px solid var(--accent);background:var(--card)}.bts p:last-child{margin:0}
.helps{background:#1f1d1a;color:#f4efe7;padding:34px 30px}.helps .eyebrow{color:#E8D9C3}.helps h2{color:#fff}.helps ol{margin:16px 0 0;padding:0;list-style:none;counter-reset:h}.helps li{counter-increment:h;position:relative;padding:14px 0 14px 48px;border-top:1px solid rgba(255,255,255,.14);font-size:17px}.helps li:before{content:counter(h);position:absolute;left:0;top:12px;width:30px;height:30px;border-radius:50%;background:#E8D9C3;color:#1f1d1a;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.road{list-style:none;margin:18px 0 0;padding:0;border-left:2px solid var(--line)}.road li{position:relative;display:flex;gap:14px;padding:12px 0 12px 22px}.road .dot{position:absolute;left:-7px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--paper,#fff);border:2px solid var(--line)}.road li.done .dot{background:var(--accent);border-color:var(--accent)}.road li.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px rgba(140,106,67,.18)}.road li.now b{color:var(--accent)}.road b{display:block;font-weight:600}.road .rd{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.feedback{display:grid;gap:12px}
.fb{background:var(--card);border:1px solid var(--line);padding:18px 20px}
.fb .meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.empty{color:var(--muted);font-style:italic}
.login{min-height:calc(100vh - 62px);display:flex;align-items:center;background:var(--night) center/cover;position:relative}
.login:after{content:"";position:absolute;inset:0;background:rgba(22,25,27,.72)}
.login .card{position:relative;z-index:1;background:var(--ground);max-width:430px;margin:40px auto;padding:36px 30px;width:calc(100% - 44px)}
.login h1{font-size:32px;margin:10px 0 10px}
.login form{display:grid;gap:12px;margin-top:18px}
.err{color:#9A4A2E;font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
footer{padding:36px 0 60px;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.hp{position:absolute;left:-9999px}
.chg{display:block;font-size:12px;color:var(--accent);margin-top:6px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.chart{margin:0;background:var(--card);border:1px solid var(--line);padding:18px 18px 10px}
.chart figcaption{font-size:13px;color:var(--muted);margin-bottom:10px}
.chart svg{display:block;width:100%;height:auto;font-family:var(--sans)}

.heroacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn.line{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}.btn.line:hover{background:#fff;color:var(--ink)}
.preview{display:block;max-width:520px;background:#fff;color:var(--ink);text-decoration:none;border-radius:10px;overflow:hidden}
.preview img{display:block;width:100%;height:auto}.preview .pv{display:block;padding:12px 14px;background:#F0F2F5}
.preview .pd{display:block;font-size:12px;color:#65676B;letter-spacing:.02em}.preview .pt{display:block;font-weight:600;font-size:15px;line-height:1.3;margin-top:2px}
.share .btn.line{color:var(--ground)}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.post{display:block;background:var(--card);border:1px solid var(--line);text-decoration:none}
.post img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}.post .pb{padding:14px 16px}
.post .meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pm{display:grid;gap:4px;margin-top:8px;font-size:14px}.pm b{font-family:var(--serif);font-weight:400;font-size:20px}
.timeline .what a{text-decoration:underline;text-underline-offset:4px}

details{border-top:1px solid var(--line);padding:16px 0}details summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none}details summary::-webkit-details-marker{display:none}details summary:after{content:" +";color:var(--muted)}details[open] summary:after{content:" –"}
.prep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 40px;margin-top:18px}.pg h3{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#8C6A43;margin:0 0 6px;font-weight:600}
.pprog{margin:4px 0 16px}.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;max-width:520px}.pbar i{display:block;height:100%;background:#8C6A43;transition:width .3s}.pprog p{margin:10px 0 0;font-size:15px}
.chk li{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.chk label{flex:1}.pa{display:flex;gap:6px;flex:none}.ask{border:0;background:none;padding:3px 0;font:inherit;font-size:12px;color:#8C6A43;cursor:pointer;opacity:.75}.ask:hover{opacity:1;text-decoration:underline}
.padd{display:flex;gap:8px;margin-top:10px}.padd input{flex:1;min-width:0}
.fq label{display:block;font-weight:500;font-size:15px;margin-bottom:8px}.fw{position:relative}.fw textarea{padding-bottom:44px}.mic{position:absolute;right:8px;bottom:10px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;color:#1E2327;cursor:pointer}.mic.on{background:#8C6A43;border-color:#8C6A43;color:#fff}
.facts{display:grid;gap:18px;max-width:720px;margin-top:20px}.facts label{display:grid;gap:8px}.facts label span{font-weight:500;font-size:15px}.facts textarea{width:100%;font:inherit;font-size:15px;padding:12px;border:1px solid var(--line);background:#fff;border-radius:2px;resize:vertical}
.chk{list-style:none;margin:0;padding:0}.chk li{padding:6px 0}.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px;line-height:1.45}.chk input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:#1E2327}.chk input:checked+span{color:var(--muted);text-decoration:line-through}
.pn{font-size:14px;color:var(--muted);font-style:italic;margin:8px 0 0}
@media(max-width:760px){.prep{grid-template-columns:1fr}}
</style>
</head>

var HOMES={"19917": {"url": "https://homes.ranchpnw.com/19917", "hero": "photos/front-dusk.jpg", "area": "Tehaleh, Bonney Lake", "price": "$775,000", "og": "photos/og-19917.jpg", "ogTitle": "19917 145th St E, Bonney Lake, WA 98391 · 5-Bed Tehaleh Home for Sale", "caption": "We just listed our home in Tehaleh! 5 bedrooms, mountain views and trails right outside. Take a look and share with anyone who might love it:", "shareTitle": "Our home in Tehaleh", "guide": {"url": "https://gotehaleh.com", "label": "the Tehaleh guide at gotehaleh.com", "short": "Life in Tehaleh"}}, "10459": {"url": "https://homes.ranchpnw.com/10459", "hero": "photos/10459/10457-des-moines-memorial-dr-5-800.webp", "og": "photos/10459/10457-des-moines-memorial-dr-5-800.webp", "area": "Seattle", "price": "$199,900", "ogTitle": "10459 Des Moines Memorial Dr S #303, Seattle, WA · $199,900", "caption": "We just listed our home in Seattle! Take a look and share with anyone who might love it:", "shareTitle": "Our home in Seattle"}, "10707": {"url": "https://homes.ranchpnw.com/10707", "hero": "photos/10707/01-10707-47th-st-e-36-800.webp", "og": "photos/10707/01-10707-47th-st-e-36-800.webp", "area": "Edgewood", "price": "$749,900", "ogTitle": "10707 47th St E, Edgewood, WA · $749,900", "caption": "We just listed our home in Edgewood! Take a look and share with anyone who might love it:", "shareTitle": "Our home in Edgewood"}, "11532": {"url": "https://homes.ranchpnw.com/11532", "hero": "photos/11532/19-main-exterior-800.webp", "og": "photos/11532/19-main-exterior-800.webp", "area": "Renton", "price": "$275,000", "ogTitle": "11532 SE 173rd St #53, Renton, WA · $275,000", "caption": "We just listed our home in Renton! 2 bedrooms, a brick fireplace, and a pool and clubhouse in the community. Take a look and share with anyone who might love it:", "shareTitle": "Our home in Renton"}, "12005": {"url": "https://homes.ranchpnw.com/12005", "hero": "photos/12005/03-12005-5th-ave-s-3-800.webp", "og": "photos/12005/03-12005-5th-ave-s-3-800.webp", "area": "Seattle", "price": "$575,000", "ogTitle": "12005 5th Ave S, Seattle, WA · $575,000", "caption": "We just listed our home in Seattle! Take a look and share with anyone who might love it:", "shareTitle": "Our home in Seattle"}, "13157": {"url": "", "hero": "photos/13157/19-13157-175th-ave-e-019-800.webp", "og": "photos/13157/19-13157-175th-ave-e-019-800.webp", "area": "Tehaleh, Bonney Lake", "price": "$465,000", "ogTitle": "13157 175th Ave E #P2, Bonney Lake, WA · $465,000", "caption": "We just listed our home in Bonney Lake! Take a look and share with anyone who might love it:", "shareTitle": "Our home in Bonney Lake"}, "sedgwick": {"url": "https://homes.ranchpnw.com/sedgwick", "hero": "photos/sedgwick/8995-se-sedgwick-rd-7-800.webp", "og": "photos/sedgwick/8995-se-sedgwick-rd-7-800.webp", "area": "Port Orchard", "price": "$500,000", "ogTitle": "0 SE Sedgwick Road, Port Orchard, WA · $500,000", "caption": "We just listed nearly 12 acres in Port Orchard, minutes from the Southworth ferry. Take a look and share with anyone who might love it:", "shareTitle": "Our home in Port Orchard"}},H={};   // each listing's page, photo, area and share text, keyed by its page
var STORY='',SHARE='';
function useHome(d){H=HOMES[String(d.page||'')]||{};STORY=H.url||'';SHARE=STORY?STORY+'#shared':''}
var app=document.getElementById('app'),KEY='ranch.seller.code';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2200)}
function day(t){return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function when(t){var d=new Date(t);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}

function login(msg){
  document.getElementById('out').hidden=true;
  app.innerHTML='<div class="login"><div class="card"><p class="eyebrow">The Ranch Real Estate Group</p><h1>Welcome home.</h1><p class="muted">Enter the code Chris gave you to see how your home is doing — visits, interest and everything being done to sell it.</p><form id="lf"><input id="code" autocomplete="one-time-code" autocapitalize="characters" placeholder="Your code" aria-label="Your code" required><div class="err" id="err">'+esc(msg||'')+'</div><button class="btn">Open my portal</button></form></div></div>';
  var h=(location.hash.match(/code=([A-Za-z0-9-]+)/)||[])[1];if(h)document.getElementById('code').value=h.toUpperCase();
  document.getElementById('lf').onsubmit=function(e){e.preventDefault();var c=document.getElementById('code').value.trim().toUpperCase();if(c)load(c,true)};
}

function load(code,fresh){
  if(fresh){var b=app.querySelector('#lf button');if(b){b.disabled=true;b.textContent='Opening…'}}
  window.CODE=code;
  var tries=0;
  function go(){
    tries++;
    var ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},25000);
    fetch(API+'?api=seller&code='+encodeURIComponent(code),ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(tm);return r.json()}).then(function(d){
      if(!d.ok){put(KEY,null);put(KEY+'.last',null);return login(d.reason||'That code didn’t match.')}
      put(KEY,code);try{localStorage.setItem(KEY+'.last',JSON.stringify(d))}catch(e){}
      if(location.hash)history.replaceState(null,'',location.pathname);render(d,code);
    }).catch(function(e){clearTimeout(tm);console.error(e);
      if(tries<3)return setTimeout(go,tries*1500);
      var last=null;try{last=JSON.parse(localStorage.getItem(KEY+'.last')||'null')}catch(x){}
      if(last&&last.ok&&get(KEY)===code){render(last,code);var n=document.createElement('p');n.className='note';n.style.cssText='text-align:center;margin:12px auto';n.textContent='You’re offline or the connection is weak, so this is the last version we loaded. Pull to refresh when you have signal.';app.insertBefore(n,app.firstChild);return}
      if(fresh)login('The connection dropped. Check your signal and tap Open again.');else login()});
  }
  go();
}

  html+='<footer><div class="wrap">'+[STORY?'<a href="'+STORY+'">See your home’s page</a>':'',H.guide?'<a href="'+H.guide.url+'">'+esc(H.guide.short||H.guide.label)+'</a>':''].filter(Boolean).join(' · ')+'<br>The Ranch Real Estate Group · Keller Williams Realty Puget Sound<div style="margin-top:14px;font-size:12px;line-height:1.7;max-width:720px"><strong style="font-weight:500">Keller Williams Realty Puget Sound</strong> · 33434 8th Ave S, Suite 103, Federal Way, WA 98003 · Each Office Is Independently Owned and Operated.<br><span style="display:inline-flex;gap:8px;align-items:center;margin-top:8px"><svg width="26" height="26" viewBox="0 0 64 64" role="img" aria-label="Equal Housing Opportunity"><path d="M32 6 4 26h7v30h42V26h7z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><rect x="21" y="32" width="22" height="5" fill="currentColor"/><rect x="21" y="42" width="22" height="5" fill="currentColor"/></svg>Equal Housing Opportunity. Information deemed reliable but not guaranteed.</span></div></div></footer>';
  app.innerHTML=html;scrollTo(0,0);
  if(STORY&&!PEND){document.getElementById('cp').onclick=function(){copy(SHARE)};
  document.getElementById('cpc').onclick=function(){copy(document.getElementById('capt').textContent)};}
  var sh=document.getElementById('sh');if(sh)sh.onclick=function(){navigator.share({title:H.shareTitle||'Our home',url:SHARE}).catch(function(){})};
  document.getElementById('mf').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button'),t=document.getElementById('msg').value.trim();if(!t||f.website.value)return;b.disabled=true;b.textContent='Sending…';
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'seller-message',code:code,name:d.sellers,question:t,page:d.page,listing:d.home,source:'seller portal'})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw 0;f.innerHTML='<p class="letter" style="margin:0">Sent. Chris will get back to you shortly.</p>'}).catch(function(){b.disabled=false;b.textContent='Send to Chris';toast('That didn’t go through — please try again.')})};
}

/* ---------- closed: thank you, what to keep, a review on Google, here for the next move ---------- */
var REVIEW_URL='__REVIEW_URL__';
function closedHtml(d){
  var tl=(d.timeline||[]).filter(function(x){return x.at&&/clos/i.test(x.what)}),cd=d.closed||(tl.length?tl[tl.length-1].at:null);
  var dl=function(t){return new Date(t).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})};
  var h='<div class="hero"'+(H.hero?' style="background-image:url('+H.hero+')"':' style="min-height:250px"')+'><div class="wrap"><p class="eyebrow">Sold'+(cd?' · '+dl(cd):'')+'</p><h1>It’s done, '+esc(d.sellers)+'. Congratulations.</h1><p>Thank you for trusting me with '+esc(d.home)+'. It was a privilege to sell it for you.</p></div></div>';
  h+='<section><div class="wrap"><p class="eyebrow">Keep these</p><h2>For your records</h2><ul class="chk" style="max-width:720px">'+[
    'Your final settlement statement from escrow. Keep it with your tax papers for this year; your tax preparer will want it.',
    'Your signed closing documents. Escrow sends a copy; save it somewhere you can find it.',
    'Once the sale has recorded, it’s time to cancel your homeowner’s insurance and close out the utilities that are still in your name.',
    'Make sure your mail is forwarded to your new address.'
  ].map(function(t){return '<li style="padding:8px 0;border-top:1px solid var(--line)">'+esc(t)+'</li>'}).join('')+'</ul></div></section>';
  if(REVIEW_URL&&REVIEW_URL.indexOf('__')!==0)h+='<section><div class="wrap"><div class="share"><p class="eyebrow" style="color:#E8D9C3">One small favor</p><h2 style="margin-bottom:6px">Would you share how it went?</h2><p style="opacity:.85;margin:0 0 18px">A few words on Google mean the world to a local business like ours, and they help the next family decide who to trust with their home.</p><a class="btn light" href="'+REVIEW_URL+'" target="_blank" rel="noopener">Leave a Google review</a></div></div></section>';
  h+='<section><div class="wrap"><p class="eyebrow">From here</p><h2>I’m still here for you</h2><p style="max-width:720px">Questions after closing, a contractor you need, or what your next home is worth down the road: just send me a note below or call or text (253) 335-5630. This page stays here for you.</p></div></section>';
  return h;
}

/* ---------- pending: congratulations, the road to closing, dates to remember, what to do now ---------- */
function pendingHtml(d){
  var tl=(d.timeline||[]).filter(function(x){return x.what}),now=Date.now();   // published in order; steps without a date yet show as "date to come"
  var close=tl.filter(function(x){return /clos/i.test(x.what)}).pop(),left=close?Math.max(0,Math.ceil((close.at-now)/864e5)):null;
  var dl=function(t){return new Date(t).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})};
  var lastAt=0;tl=tl.map(function(x,i){if(x.at)lastAt=x.at;return {x:x,k:x.at||lastAt,i:i}}).sort(function(a,b){return a.k-b.k||a.i-b.i}).map(function(o){return o.x});
  var road=tl.length?tl:[{what:'Mutual acceptance'},{what:'Inspection'},{what:'Appraisal'},{what:'Loan approval'},{what:'Signing with escrow'},{what:'Closing day'}];
  var nxt=tl.filter(function(x){return !x.done&&x.at&&x.at>=now-864e5})[0];
  var h='<div class="hero"'+(H.hero?' style="background-image:url('+H.hero+')"':' style="min-height:250px"')+'><div class="wrap"><p class="eyebrow">Under contract'+(close?' · closing '+dl(close.at):'')+'</p><h1>Congratulations, '+esc(d.sellers)+'.</h1><p>'+esc(d.home)+' is pending. From here, my job is getting you to the closing table smoothly, and you’ll see every step right here.</p></div></div>';
  var mut=tl.filter(function(x){return /mutual/i.test(x.what)&&x.at})[0],prog='';
  if(mut&&close&&close.at>mut.at){
    var D=function(t){var x=new Date(t);return Date.UTC(x.getFullYear(),x.getMonth(),x.getDate())/864e5},tot=Math.round(D(close.at)-D(mut.at)),day=Math.min(tot,Math.max(0,Math.round(D(now)-D(mut.at)))),pct=Math.round(day/tot*100);
    var ticks=tl.filter(function(x){return x.at&&x!==mut&&x!==close}).map(function(x){var p=Math.max(0,Math.min(100,(D(x.at)-D(mut.at))/tot*100));return '<i class="tk'+(x.done||D(x.at)<D(now)?' on':'')+'" style="left:'+p.toFixed(1)+'%" title="'+esc(x.what)+' · '+dl(x.at)+'"></i>'}).join('');
    prog='<div class="dayc"><div class="dn">Day <b>'+day+'</b> of '+tot+'</div><div class="dl">'+(left===0?'Closing day is today':left===1?'1 day to closing':left+' days to closing')+(nxt?' · next: <b>'+esc(nxt.what)+'</b>, '+dl(nxt.at):'')+'</div><div class="trk"><span style="width:'+pct+'%"></span>'+ticks+'<i class="you" style="left:'+pct+'%"></i></div><div class="tke"><span>Mutual acceptance<br>'+dl(mut.at)+'</span><span style="text-align:right">Closing<br>'+dl(close.at)+'</span></div></div>';
  }
  h+='<section><div class="wrap"><p class="eyebrow">Where we are</p><h2>The road to closing</h2>'+(prog||(left!=null?'<div class="shsum"><div>'+left+'<span>days to closing</span></div>'+(nxt?'<div style="font-size:24px">'+esc(nxt.what)+'<span>next · '+dl(nxt.at)+'</span></div>':'')+'</div>':''))+
    '<ol class="road">'+road.map(function(x){var st=x.done?'done':(nxt&&x===nxt)?'now':'';return '<li class="'+st+'"><span class="dot"></span><div><b>'+esc(x.what)+'</b>'+(x.at?'<span class="rd">'+dl(x.at)+'</span>':(tl.length?'<span class="rd">Date to come</span>':''))+(x.note?'<div class="muted small">'+esc(x.note)+'</div>':'')+'</div></li>'}).join('')+'</ol>'+
    (tl.length?'':'<p class="note">Your exact dates go up here as soon as the paperwork is final.</p>')+
    '<div class="bts"><p class="eyebrow">Behind the scenes</p><p>A lot of people help get a home to closing: the buyers’ lender, the appraiser, inspectors, title and escrow, the HOA, and both agents’ teams. Keeping all of them on schedule is our job, not yours. Most of it happens quietly in the background. When we do need something from you, we’ll keep it short and clear, and you’ll see it here or hear it from me.</p></div></div></section>';
  h+='<section><div class="wrap"><div class="helps"><p class="eyebrow">While we’re pending</p><h2>What helps right now</h2><ol>'+[
    'Keep the home much as it looked when it sold. The buyers’ inspector and appraiser will both be visiting.',
    'Keep your homeowner’s insurance in place until after closing day.',
    'Hold on to any receipts or warranties for recent work, in case questions come up.',
    'Start gathering keys, garage remotes and appliance manuals to leave for the buyers. Your moving checklist below has the rest.',
    'Watch for an email from escrow to set up your signing. Never wire money based on an email alone; call me first.'
  ].map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ol></div></div></section>';
  return h;
}

function marketSection(rows){
  rows=(rows||[]).filter(function(r){return r.month});
  if(!rows.length)return '';
  var area=rows[rows.length-1].area||'Your market',last=rows[rows.length-1];
  var prev=rows.filter(function(r){var a=+last.month.slice(0,4),b=+r.month.slice(0,4);return r.month.slice(5)===last.month.slice(5)&&a-b===1})[0];
  function mlabel(m){var d=new Date(m+'-15');return d.toLocaleDateString('en-US',{month:'short'})+(m.slice(5)==='01'?' '+m.slice(2,4):'')}
  function chg(a,b,inv){if(a==null||b==null||!b)return '';var p=Math.round((a-b)/b*100);if(!p)return '<span class="chg">same as last year</span>';return '<span class="chg">'+(p>0?'▲ ':'▼ ')+Math.abs(p)+'% vs last year</span>'}
  function tileM(v,l,c){return '<div class="stat"><div class="n">'+v+'</div><div class="l">'+l+'</div>'+(c||'')+'</div>'}
  var money=function(n){return n==null?'—':n>=1e6?'$'+(n/1e6).toFixed(2).replace(/0$/,'')+'M':'$'+Math.round(n/1e3)+'K'};
  var tiles=tileM(money(last.median),'median sold price · '+mlabel(last.month),chg(last.median,prev&&prev.median))+
    tileM(last.sold==null?'—':last.sold,'homes sold',chg(last.sold,prev&&prev.sold))+
    tileM(last.dom==null?'—':last.dom,'median days on market',chg(last.dom,prev&&prev.dom))+
    tileM(last.moi==null?'—':(Math.round(last.moi*10)/10),'months of inventory','<span class="chg">'+(last.moi==null?'':last.moi<3?'a seller’s market':last.moi<=5?'a balanced market':'a buyer’s market')+'</span>')+
    tileM(last.stl==null?'—':last.stl+'%','of list price, on average','')+
    tileM(last.active==null?'—':last.active,'homes for sale now','');
  var pts=rows.filter(function(r){return r.median!=null}).slice(-13),chart='';
  if(pts.length>=3){
    var W=640,H=240,L=8,R=8,T=34,B=38,mn=Math.min.apply(null,pts.map(function(r){return r.median})),mx=Math.max.apply(null,pts.map(function(r){return r.median}));
    var pad=(mx-mn)*0.15||mx*0.05;mn-=pad;mx+=pad;
    var X=function(i){return L+i*(W-L-R)/(pts.length-1)},Y=function(v){return T+(mx-v)/(mx-mn)*(H-T-B)};
    var path=pts.map(function(r,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(r.median).toFixed(1)}).join(' ');
    var area2=path+' L'+X(pts.length-1).toFixed(1)+' '+(H-B)+' L'+X(0)+' '+(H-B)+' Z';
    var lab=pts.map(function(r,i){return (i===0||i===pts.length-1||i%3===0)?'<text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(i===0?'start':i===pts.length-1?'end':'middle')+'" font-size="19" fill="#5E584E">'+mlabel(r.month)+'</text>':''}).join('');
    var lastP=pts[pts.length-1];
    chart='<figure class="chart"><figcaption>Median sold price, last '+pts.length+' months</figcaption><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Median sold price by month in '+esc(area)+'"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8C6A43" stop-opacity=".18"/><stop offset="1" stop-color="#8C6A43" stop-opacity="0"/></linearGradient></defs><line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="#D9D2C6"/><path d="'+area2+'" fill="url(#mg)"/><path d="'+path+'" fill="none" stroke="#8C6A43" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+X(pts.length-1)+'" cy="'+Y(lastP.median)+'" r="5" fill="#8C6A43"/><text x="'+(X(pts.length-1)-10)+'" y="'+(Y(lastP.median)-12)+'" text-anchor="end" font-size="21" font-weight="600" fill="#1E2327">'+money(lastP.median)+'</text>'+lab+'</svg></figure>';
  }
  var sp=rows.filter(function(r){return r.sold!=null}).slice(-13),bars='';
  if(sp.length>=3){
    var W2=640,H2=200,mx2=Math.max.apply(null,sp.map(function(r){return r.sold}))||1,bw=(W2-16)/sp.length;
    bars='<figure class="chart"><figcaption>Homes sold each month</figcaption><svg viewBox="0 0 '+W2+' '+H2+'" role="img" aria-label="Homes sold by month in '+esc(area)+'">'+sp.map(function(r,i){var h=(r.sold/mx2)*(H2-70),x=8+i*bw+bw*0.18,w=bw*0.64;return '<rect x="'+x.toFixed(1)+'" y="'+(H2-36-h).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+(i===sp.length-1?'#8C6A43':'#D9CBB6')+'"/>'+(i===sp.length-1||i%3===0?'<text x="'+(x+w/2).toFixed(1)+'" y="'+(H2-8)+'" text-anchor="middle" font-size="19" fill="#5E584E">'+mlabel(r.month)+'</text>':'')+(i===sp.length-1?'<text x="'+(x+w/2).toFixed(1)+'" y="'+(H2-44-h).toFixed(1)+'" text-anchor="middle" font-size="21" font-weight="600" fill="#1E2327">'+r.sold+'</text>':'')}).join('')+'</svg></figure>';
  }
  var src=rows.map(function(r){return r.source}).filter(Boolean).pop();
  return '<section><div class="wrap"><p class="eyebrow">Your market · '+esc(area)+'</p><h2>What the market is doing</h2><div class="stats">'+tiles+'</div><div class="charts">'+chart+bars+'</div>'+(src?'<p class="note">Source: '+esc(src)+'. Updated '+mlabel(last.month)+'.</p>':'')+'</div></section>';
}
function pm(n,l){return n==null?'':'<span><b>'+Number(n).toLocaleString('en-US')+'</b> '+l+'</span>'}
function stat(n,l){return '<div class="stat"><div class="n">'+(n==null?'—':Number(n).toLocaleString('en-US'))+'</div><div class="l">'+l+'</div></div>'}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Copied')}).catch(function(){prompt('Copy this',t)})}
document.getElementById('out').onclick=function(){put(KEY,null);login()};
var saved=get(KEY);
if(saved&&!/code=/.test(location.hash)){app.innerHTML='<div class="login"></div>';load(saved,false)}else login();
})();
</script>
