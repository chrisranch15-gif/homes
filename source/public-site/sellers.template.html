<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Your seller portal · The Ranch Real Estate Group</title>
<meta name="theme-color" content="#16191B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--ink:#1E2327;--ground:#F7F5F1;--accent:#8C6A43;--night:#16191B;--muted:#5E584E;--line:#D9D2C6;--card:#fff;--soft:#EFEBE4;--ok:#3F6B45}
*{box-sizing:border-box}html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font:16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15}
a{color:inherit}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
.wrap{max-width:880px;margin:0 auto;padding:0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:1px solid var(--ink);background:var(--ink);color:var(--ground);font:inherit;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{background:transparent;color:var(--ink)}.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:var(--ground)}
.btn.light{background:var(--ground);color:var(--ink);border-color:var(--ground)}
.btn[disabled]{opacity:.6;cursor:default}
input,textarea{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:0;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.top{background:var(--night);color:var(--ground)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;min-height:62px;gap:12px}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.02em}
.brand small{display:block;font:11px var(--sans);letter-spacing:.22em;text-transform:uppercase;opacity:.65}
.top button{background:none;border:0;color:var(--ground);opacity:.7;font:13px var(--sans);cursor:pointer;text-decoration:underline;text-underline-offset:4px}
.hero{position:relative;background:var(--night) center/cover no-repeat;color:#fff;min-height:430px;display:flex;align-items:flex-end}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(22,25,27,.1) 20%,rgba(22,25,27,.82))}
.hero .wrap{position:relative;z-index:1;padding-bottom:40px;width:100%}
.hero h1{font-size:clamp(34px,6vw,54px);margin:10px 0 8px}
.hero .eyebrow{color:#E8D9C3}
.hero p{margin:0;opacity:.9}
section{padding:46px 0;border-bottom:1px solid var(--line)}
section h2{font-size:30px;margin:8px 0 18px}
.journey{display:flex;gap:0;margin:0;padding:0;list-style:none;overflow-x:auto}
.journey li{flex:1 0 110px;padding:14px 10px 0 0;border-top:2px solid var(--line);font-size:13px;color:var(--muted);position:relative}
.journey li:before{content:"";position:absolute;top:-6px;left:0;width:10px;height:10px;border-radius:50%;background:var(--line)}
.journey li.done{border-color:var(--ink);color:var(--ink)}.journey li.done:before{background:var(--ink)}
.journey li.now{border-color:var(--accent);color:var(--ink);font-weight:500}.journey li.now:before{background:var(--accent);box-shadow:0 0 0 4px rgba(140,106,67,.2)}
.journey b{display:block;font-weight:500;color:inherit}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--card);padding:20px 18px}
.stat .n{font-family:var(--serif);font-size:40px;line-height:1}
.stat .l{font-size:13px;color:var(--muted);margin-top:8px}
@media(max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.letter{background:var(--card);border:1px solid var(--line);padding:28px}
.letter h3{font-size:24px;margin:6px 0 12px}
.letter p{margin:0 0 12px;white-space:pre-line}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.timeline .when{font-size:13px;color:var(--muted)}
.timeline .what{font-weight:500}
.timeline .reach{display:inline-block;font-size:12px;letter-spacing:.06em;background:var(--soft);padding:2px 8px;margin-left:6px;vertical-align:2px}
.share{background:var(--night);color:var(--ground);padding:30px}
.share .link{display:flex;gap:10px;margin:16px 0 10px;flex-wrap:wrap}
.share .link input{flex:1 1 260px;background:rgba(255,255,255,.06);border-color:rgba(247,245,241,.25);color:var(--ground)}
.share .cap{font-size:14px;opacity:.85;border-left:2px solid var(--accent);padding-left:14px;margin-top:14px}
.feedback{display:grid;gap:12px}
.fb{background:var(--card);border:1px solid var(--line);padding:18px 20px}
.fb .meta{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.empty{color:var(--muted);font-style:italic}
.login{min-height:calc(100vh - 62px);display:flex;align-items:center;background:var(--night) center/cover;position:relative}
.login:after{content:"";position:absolute;inset:0;background:rgba(22,25,27,.72)}
.login .card{position:relative;z-index:1;background:var(--ground);max-width:430px;margin:40px auto;padding:36px 30px;width:calc(100% - 44px)}
.login h1{font-size:32px;margin:10px 0 10px}
.login form{display:grid;gap:12px;margin-top:18px}
.err{color:#9A4A2E;font-size:14px;min-height:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
footer{padding:36px 0 60px;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">The Ranch Real Estate Group<small>Your seller portal</small></div><button id="out" hidden>Sign out</button></div></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
(function(){
var API='__API__';
var SHARE='https://homes.ranchpnw.com/19917#shared';
var STORY='https://homes.ranchpnw.com/19917';
var app=document.getElementById('app'),KEY='ranch.seller.code';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('on')},2200)}
function day(t){return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function when(t){var d=new Date(t);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}

function login(msg){
  document.getElementById('out').hidden=true;
  app.innerHTML='<div class="login" style="background-image:url(photos/front-dusk.jpg)"><div class="card"><p class="eyebrow">19917 145th St E · Tehaleh</p><h1>Welcome home.</h1><p class="muted">Enter the code Chris gave you to see how your home is doing — visits, interest and everything being done to sell it.</p><form id="lf"><input id="code" autocomplete="one-time-code" autocapitalize="characters" placeholder="Your code" aria-label="Your code" required><div class="err" id="err">'+esc(msg||'')+'</div><button class="btn">Open my portal</button></form></div></div>';
  var h=(location.hash.match(/code=([A-Za-z0-9-]+)/)||[])[1];if(h)document.getElementById('code').value=h.toUpperCase();
  document.getElementById('lf').onsubmit=function(e){e.preventDefault();var c=document.getElementById('code').value.trim().toUpperCase();if(c)load(c,true)};
}

function load(code,fresh){
  if(fresh){var b=app.querySelector('#lf button');if(b){b.disabled=true;b.textContent='Opening…'}}
  fetch(API+'?api=seller&code='+encodeURIComponent(code)).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){put(KEY,null);return login(d.reason||'That code didn’t match.')}
    put(KEY,code);if(location.hash)history.replaceState(null,'',location.pathname);render(d,code);
  }).catch(function(e){console.error(e);if(fresh)login('We couldn’t reach the portal. Please try again.');else login()});
}

var STAGES=[['Prepared','Photos, story, pricing'],['Listed','On NWMLS'],['Showing','Tours & open houses'],['Offer','Review & negotiate'],['Under contract','Inspection & appraisal'],['Closed','Keys handed over']];
function stageIndex(s){s=String(s||'').toLowerCase();if(/closed|sold/.test(s))return 5;if(/contract|pending/.test(s))return 4;if(/offer/.test(s))return 3;return 2}

function render(d,code){
  document.getElementById('out').hidden=false;
  var m=d.metrics||{},first=String(d.sellers||'').split(/ and | & /),listed=d.listed||1795132800000;
  var days=Math.max(1,Math.ceil((Date.now()-listed)/864e5));
  var si=stageIndex(d.status);
  var auto=[
    {at:listed,what:'Listed on NWMLS at $775,000',reach:'every agent in the MLS'},
    {at:listed+60000,what:'Your home’s story went live — homes.ranchpnw.com/19917',reach:'shareable'},
    {at:listed+120000,what:'Linked from the Tehaleh guide at gotehaleh.com and set up for Google and AI search',reach:''},
    {at:listed+180000,what:'Sign QR codes and instant tour and follow requests turned on',reach:''}
  ];
  var mk=(d.marketing||[]).concat(auto).sort(function(a,b){return b.at-a.at});
  var up=(d.updates||[])[0];
  var html='';
  html+='<div class="hero" style="background-image:url(photos/front-dusk.jpg)"><div class="wrap"><p class="eyebrow">Day '+days+' on the market · '+esc(d.status||'Active')+'</p><h1>Welcome, '+esc(d.sellers)+'.</h1><p>'+esc(d.home)+' · Tehaleh, Bonney Lake</p></div></div>';
  html+='<section><div class="wrap"><p class="eyebrow">Where we are</p><h2>Your journey</h2><ol class="journey">'+STAGES.map(function(s,i){return '<li class="'+(i<si?'done':i===si?'now':'')+'"><b>'+s[0]+'</b>'+s[1]+'</li>'}).join('')+'</ol></div></section>';
  html+='<section><div class="wrap"><p class="eyebrow">Live · updated '+when(d.at)+'</p><h2>How your home is doing</h2><div class="stats">'+
    stat(m.visitors,'people have viewed your home’s story')+stat(m.visitors7,'in the last 7 days')+stat(m.shared,'visits from links you shared')+
    stat(m.tours,'tour requests')+stat(m.following,'people following your home')+stat(m.scans,'sign QR scans')+
    '</div><p class="note">Counts only. Buyers’ names and contact details stay private with Chris. NWMLS showings booked by other agents are reported below as feedback comes in.</p></div></section>';
  html+='<section><div class="wrap"><p class="eyebrow">From Chris</p><h2>Latest update</h2>'+(up?'<div class="letter"><p class="small muted">'+when(up.at)+'</p><h3>'+esc(up.title)+'</h3><p>'+esc(up.text)+'</p><p class="small muted">— '+esc(up.from||'Chris')+'</p></div>':'<div class="letter"><h3>You’re live.</h3><p>Your home went live on NWMLS on November 19 at about 4 PM. Every update from here — showings, feedback and next steps — will land on this page.</p><p class="small muted">— Chris</p></div>')+
    ((d.updates||[]).length>1?'<ul class="timeline" style="margin-top:18px">'+d.updates.slice(1).map(function(u){return '<li><div class="when">'+day(u.at)+'</div><div><div class="what">'+esc(u.title)+'</div><div class="muted small" style="white-space:pre-line">'+esc(u.text)+'</div></div></li>'}).join('')+'</ul>':'')+'</div></section>';
  html+='<section><div class="wrap"><div class="share"><p class="eyebrow" style="color:#E8D9C3">Help us spread the word</p><h2 style="margin-bottom:6px">Share your home</h2><p style="opacity:.85;margin:0">Post this link on Facebook or Instagram, or text it to friends. It shows a photo preview, and every visit from it is counted above.</p><div class="link"><input readonly value="'+SHARE+'" onfocus="this.select()" aria-label="Your share link"><button class="btn light" id="cp">Copy link</button>'+(navigator.share?'<button class="btn light" id="sh">Share…</button>':'')+'</div><p class="cap" id="capt">We just listed our home in Tehaleh! 5 bedrooms, mountain views and trails right outside. Take a look and share with anyone who might love it: '+SHARE+'</p><button class="btn light" id="cpc" style="margin-top:12px">Copy this caption</button></div></div></section>';
  html+='<section><div class="wrap"><p class="eyebrow">Done for you</p><h2>Everything we’re doing to sell your home</h2><ul class="timeline">'+mk.map(function(x){return '<li><div class="when">'+day(x.at)+'</div><div><span class="what">'+esc(x.what)+'</span>'+(x.reach?'<span class="reach">'+esc(x.reach)+'</span>':'')+(x.notes?'<div class="muted small">'+esc(x.notes)+'</div>':'')+'</div></li>'}).join('')+'</ul></div></section>';
  html+='<section><div class="wrap"><p class="eyebrow">What buyers are saying</p><h2>Showing feedback</h2><div class="feedback">'+((d.showings||[]).length?d.showings.map(function(s){return '<div class="fb"><div class="meta">'+day(s.at)+(s.interest?' · '+esc(s.interest):'')+'</div><div>'+esc(s.feedback)+'</div></div>'}).join(''):'<p class="empty">Feedback from buyers’ agents will appear here after each showing.</p>')+'</div></div></section>';
  html+='<section><div class="wrap"><p class="eyebrow">Anything on your mind?</p><h2>Message Chris</h2><form id="mf" style="display:grid;gap:12px;max-width:560px"><textarea id="msg" required placeholder="A question, a showing window that doesn’t work, something you noticed…" aria-label="Your message"></textarea><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><div><button class="btn">Send to Chris</button></div></form></div></section>';
  html+='<footer><div class="wrap"><a href="'+STORY+'">See your home’s story</a> · <a href="https://gotehaleh.com">Life in Tehaleh</a><br>The Ranch Real Estate Group · Keller Williams Puget Sound</div></footer>';
  app.innerHTML=html;scrollTo(0,0);
  document.getElementById('cp').onclick=function(){copy(SHARE)};
  document.getElementById('cpc').onclick=function(){copy(document.getElementById('capt').textContent)};
  var sh=document.getElementById('sh');if(sh)sh.onclick=function(){navigator.share({title:'Our home in Tehaleh',url:SHARE}).catch(function(){})};
  document.getElementById('mf').onsubmit=function(e){e.preventDefault();var f=e.target,b=f.querySelector('button'),t=document.getElementById('msg').value.trim();if(!t||f.website.value)return;b.disabled=true;b.textContent='Sending…';
    fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'seller-message',code:code,name:d.sellers,question:t,page:d.page,listing:d.home,source:'seller portal'})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw 0;f.innerHTML='<p class="letter" style="margin:0">Sent. Chris will get back to you shortly.</p>'}).catch(function(){b.disabled=false;b.textContent='Send to Chris';toast('That didn’t go through — please try again.')})};
}
function stat(n,l){return '<div class="stat"><div class="n">'+(n==null?'—':n)+'</div><div class="l">'+l+'</div></div>'}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('Copied')}).catch(function(){prompt('Copy this',t)})}
document.getElementById('out').onclick=function(){put(KEY,null);login()};
var saved=get(KEY);
if(saved&&!/code=/.test(location.hash)){app.innerHTML='<div class="login" style="background-image:url(photos/front-dusk.jpg)"></div>';load(saved,false)}else login();
})();
</script>
</body>
</html>
